# Happy Sad Mi chatbot Worker
#
# Deploys to: portfolio.happysadmi.workers.dev
#
# The account_id is pinned deliberately. The Worker must never be able to
# land in a different Cloudflare account just because someone happens to be
# logged into the wrong one when they run `wrangler deploy`.
#
# Verified account: happysadmi@gmail.com -> 010abb6f8110187db697437e1747394c

name = "portfolio"
main = "src/index.js"
compatibility_date = "2026-10-03"
account_id = "010abb6f8110187db697437e1747394c"

[observability]
enabled = true

# Rate limiting.
#
# A Cloudflare WAF rate-limiting rule was the preferred option in the plan,
# but it is a ZONE feature and this account has no zone (workers.dev only)
# on the Free plan. Enforcement therefore lives in the Worker, using one
# Durable Object per client IP. Without this, a module-level Map would only
# throttle whichever isolate happened to serve an attacker.

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Workers AI binding. Without this, env.AI does not exist.
[ai]
binding = "AI"

[vars]
# Where the live site content is fetched from. Note the /thehappysadmi/
# subpath: the site is served from a GitHub Pages project path.
SITE_URL = "https://happysadmi.github.io/thehappysadmi"

# Comma-separated list of browser origins allowed to call this endpoint.
# This is the HOST only -- CORS has no concept of a path.
ALLOWED_ORIGINS = "https://happysadmi.github.io"

# Seconds to hold the assembled site content in the edge cache.
CONTENT_CACHE_TTL = "300"

# Sustained /chat requests allowed per minute, per IP.
# Kept generous on purpose: many Philippine mobile subscribers share one
# public IP behind carrier NAT, so a tight limit locks out real visitors.
RATE_LIMIT_PER_MINUTE = "20"

# Token bucket depth, i.e. short bursts are tolerated.
RATE_LIMIT_BURST = "10"

# Workers AI model. Swap here, no code change needed.
#   @cf/meta/llama-3.1-8b-instruct-fp8  fast + cheap, good for this scope
#   @cf/openai/gpt-oss-120b              stronger refusals, slower and dearer
#   @cf/mistral/mistral-7b-instruct-v0.2-lora
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"

# Hard ceiling on a single model call, so a hung request cannot pin an isolate.
AI_TIMEOUT_MS = "25000"